name: Analyze Excel
on:
  workflow_dispatch:
    inputs:
      input_path:
        description: '저장소 안 Excel 경로 (예: data/papers.xlsx)'
        required: true
        default: data/example.xlsx
        type: string
      mode:
        description: 'sample: 최대 100건 / full: 전체'
        type: choice
        options: [sample, full]
        default: sample
      config_path:
        description: '분석 설정 JSON 경로'
        type: string
        default: config.json
      publish_pages:
        description: '분석 HTML 화면을 GitHub Pages에 공개 게시 (ZIP·Excel 제외)'
        type: boolean
        default: true
  workflow_call:
    secrets:
      RESULTS_PASSWORD:
        required: false
    inputs:
      input_path:
        type: string
        default: data/example.xlsx
      mode:
        type: string
        default: sample
      config_path:
        type: string
        default: config.json
      publish_pages:
        type: boolean
        default: true
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      MPLBACKEND: Agg
      INPUT_PATH: ${{ inputs.input_path }}
      MODE: ${{ inputs.mode }}
      CONFIG_PATH: ${{ inputs.config_path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum
          python -m pip install -r requirements.txt
      - name: Analyze
        run: python run_analysis.py "$INPUT_PATH" --mode "$MODE" --config "$CONFIG_PATH"
      - name: Encrypt administrator results
        if: ${{ !cancelled() }}
        env:
          RESULTS_PASSWORD: ${{ secrets.RESULTS_PASSWORD }}
        run: python encrypt_results.py
      - name: Downloadable encrypted results
        if: ${{ !cancelled() && hashFiles('admin-output/admin-results.zip') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: admin-results-${{ inputs.mode }}-${{ github.run_id }}
          path: admin-output/admin-results.zip
          if-no-files-found: error
          retention-days: 14
      - name: Prepare HTML-only Pages site
        if: inputs.publish_pages
        run: python build_pages.py --mode "$MODE"
      - name: Upload Pages site
        if: inputs.publish_pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/
  deploy:
    if: inputs.publish_pages
    needs: analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
