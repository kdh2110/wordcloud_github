name: Analyze Excel
on:
  workflow_dispatch:
    inputs:
      input_path:
        description: '저장소 안 Excel 경로 (예: data/papers.xlsx)'
        required: true
        default: data/example.xlsx
        type: string
      mode:
        description: 'sample: 최대 100건 / full: 전체'
        type: choice
        options: [sample, full]
        default: sample
      config_path:
        description: '분석 설정 JSON 경로'
        type: string
        default: config.json
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      MPLBACKEND: Agg
      INPUT_PATH: ${{ inputs.input_path }}
      MODE: ${{ inputs.mode }}
      CONFIG_PATH: ${{ inputs.config_path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum
          python -m pip install -r requirements.txt
      - name: Analyze
        run: python run_analysis.py "$INPUT_PATH" --mode "$MODE" --config "$CONFIG_PATH"
      - name: Downloadable results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: wordcloud-${{ inputs.mode }}-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 14
