name: Remove public downloads
on:
  push:
    branches: [main]
    paths: [.github/workflows/refresh-pages.yml]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: '화면을 보존할 성공한 Pages 배포 실행 ID'
        type: string
        default: '41392291287'
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      obsolete_artifacts: ${{ steps.inventory.outputs.obsolete_artifacts }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record old plaintext artifacts
        id: inventory
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo,
              {...context.repo, per_page: 100});
            const old = artifacts.filter(a => a.name === 'github-pages' ||
              /^wordcloud-(sample|full)-\d+$/.test(a.name));
            core.setOutput('obsolete_artifacts', JSON.stringify(old.map(a => a.id)));
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: previous-site
          run-id: ${{ inputs.source_run_id || '41392291287' }}
          github-token: ${{ github.token }}
      - name: Keep the existing explorer, remove downloadable files
        run: python sanitize_pages.py previous-site/artifact.tar
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
  deploy:
    needs: refresh
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify public HTML and blocked download URLs
        uses: actions/github-script@v7
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        with:
          script: |
            let last = '';
            for (let attempt = 0; attempt < 12; attempt++) {
              const base = new URL(process.env.PAGE_URL);
              const get = path => {
                const url = new URL(path, base);
                url.searchParams.set('check', String(Date.now()));
                return fetch(url);
              };
              const index = await get('');
              const html = await index.text();
              const zip = await get('results.zip');
              const excel = await get('analysis.xlsx');
              const data = await get('paper_explorer_assets/data.js');
              const images = await get('paper_explorer_assets/images.js');
              last = `HTML=${index.status}, ZIP=${zip.status}, Excel=${excel.status}, data=${data.status}, images=${images.status}`;
              if (index.ok && data.ok && images.ok && zip.status === 404 && excel.status === 404 &&
                  !html.includes('href="results.zip"') && !html.includes('href="analysis.xlsx"')) {
                core.info(last);
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error(`Pages verification failed: ${last}`);
  cleanup:
    needs: [refresh, deploy]
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Remove previous plaintext artifact copies
        uses: actions/github-script@v7
        env:
          ARTIFACT_IDS: ${{ needs.refresh.outputs.obsolete_artifacts }}
        with:
          script: |
            for (const artifact_id of JSON.parse(process.env.ARTIFACT_IDS)) {
              try {
                await github.rest.actions.deleteArtifact({...context.repo, artifact_id});
                core.info(`Removed old plaintext artifact ${artifact_id}`);
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
