name: Publish Pages example
on:
  push:
    branches: [main]
    paths:
      - data/example.xlsx
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  example:
    uses: ./.github/workflows/analyze.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      input_path: data/example.xlsx
      mode: sample
      config_path: config.json
      publish_pages: true
